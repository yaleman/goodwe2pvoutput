---
name: Python linting

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
      - name: Running linting
        run: |
          python -m pip install --quiet --no-cache-dir --upgrade uv
          uv run ruff check
