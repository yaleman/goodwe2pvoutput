
[project]
name = "goodwe2pvoutput"
version = "0.2.1"
description = "Goodwe to PVOutput"
authors = [{ name = "yaleman", email = "james@terminaloutcomes.com" }]
requires-python = "<4.0,>=3.12"
dependencies = [
    "schedule>=1.2.2",
    "pygoodwe>=0.1.11",
    "pvoutput>=0.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "coveralls>=4.1.0",
]

[project.scripts]
goodwe2pvoutput = "goodwe2pvoutput.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goodwe2pvoutput"]

[tool.pytest]
norecursedirs = ["layer_requirements/", ".venv/", ".terraform/"]
testpaths = ["tests"]
